name: CI

on:
  pull_request:
    branches:
      - main
      - market
  push:
    branches:
      - main
      - market

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Cache node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

      - name: Run Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Cache node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

      - name: Cache dist
        id: cache-libs-dist
        uses: actions/cache/save@v4
        with:
          path: libs/*/dist
          key: ${{ runner.os }}-dist-${{ hashFiles('libs/*/dist') }}

      - name: Run Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Cache node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

      - name: Restore Cache dist
        uses: actions/cache/restore@v4
        with:
          path: libs/*/dist
          key: ${{ steps.cache-libs-dist.outputs.cache-primary-key }}

      - name: Run CI Checks
        run: npm run test
